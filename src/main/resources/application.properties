spring.application.name=api
spring.datasource.url=jdbc:mysql://localhost:3306/lafogata
spring.datasource.username=${DB_USER:lafogata_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
server.error.include-message=always
server.error.include-stacktrace=never

app.admin.user=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
